name: CI — Build, Unit and E2E Tests

# Required status check on main. No paths-ignore here: a workflow
# filtered out by paths never reports, and a required check that never reports
# blocks the PR forever. The `changes` job skips the work instead — a skipped
# job counts as passing.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: filter
        run: |
          CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qvE '^docs/|^README\.md$|^CHANGELOG\.md$|\.txt$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docs-only change — build and tests skipped"
          fi

  build-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore SBOMViewer.slnx

      - run: dotnet build SBOMViewer.slnx --no-restore -c Release

      - name: Run unit tests
        run: |
          dotnet test tests/SBOMViewer.Blazor.Tests/SBOMViewer.Blazor.Tests.csproj \
            --no-build -c Release \
            --logger "trx;LogFileName=unit-tests.trx" \
            --results-directory TestResults

      - run: dotnet publish src/SBOMViewer.Blazor/SBOMViewer.Blazor.csproj -c Release --output publish_output

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start static file server for E2E (SPA mode)
        run: npx --yes serve@14 -s publish_output/wwwroot -l 5000 &

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000 > /dev/null 2>&1 && echo "Ready in ${i}s" && exit 0
            sleep 1
          done
          echo "Server not ready"; exit 1

      - name: Install Playwright Chromium
        run: pwsh tests/SBOMViewer.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run E2E tests
        env:
          BASE_URL: http://localhost:5000
        run: |
          dotnet test tests/SBOMViewer.E2E.Tests/SBOMViewer.E2E.Tests.csproj \
            --no-build -c Release \
            --logger "trx;LogFileName=e2e-tests.trx" \
            --results-directory TestResults

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 14

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/SBOMViewer.E2E.Tests/bin/Release/net10.0/playwright-traces/
          retention-days: 7
          if-no-files-found: ignore
