name: Release — Build Once, Staging, Approve, Production

# One path to production. Every merge to main:
#   build once -> staging -> smoke -> [approve: production environment] -> production -> smoke -> tag + release
# The artifact approved on staging is the artifact deployed to production.
# The tag is created last, so a tag exists only for a version that went live,
# and a run rejected at the gate never consumes a version number.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - '**.txt'

# One release at a time. A merge made while a run waits for approval queues
# behind it (only the newest queued run is kept), so versions never collide.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, for the version

      - name: Compute version from tags
        id: version
        run: |
          LINE=$(sed -n 's|.*<VersionPrefix>\([0-9]*\.[0-9]*\)\.[0-9]*</VersionPrefix>.*|\1|p' Directory.Build.props)
          if [ -z "$LINE" ]; then echo "::error::No MAJOR.MINOR.x VersionPrefix in Directory.Build.props"; exit 1; fi
          LAST=$(git tag -l "v${LINE}.*" | sed "s/^v${LINE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)
          VERSION="${LINE}.$(( ${LAST:--1} + 1 ))"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" > /dev/null; then
            echo "::error::Tag v${VERSION} already exists"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release line ${LINE}, last patch ${LAST:-none} -> ${VERSION}"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore SBOMViewer.slnx

      - run: dotnet build SBOMViewer.slnx --no-restore -c Release -p:Version=${{ steps.version.outputs.version }}

      # Full E2E already ran on the PR (required check). Unit tests are cheap insurance
      # that main still builds and passes after the merge.
      - name: Run unit tests
        run: |
          dotnet test tests/SBOMViewer.Blazor.Tests/SBOMViewer.Blazor.Tests.csproj \
            --no-build -c Release

      - run: dotnet publish src/SBOMViewer.Blazor/SBOMViewer.Blazor.csproj -c Release -p:Version=${{ steps.version.outputs.version }} --output publish_output

      - name: Generate SBOM
        run: |
          dotnet tool install --global CycloneDX
          VERSION="${{ steps.version.outputs.version }}"
          dotnet CycloneDX src/SBOMViewer.Blazor/SBOMViewer.Blazor.csproj \
            -o publish_output/wwwroot \
            -fn "sbomviewer_${VERSION}.json" \
            -F Json \
            -t \
            -sv "$VERSION" \
            -sn SBOMViewer

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: publish_output/wwwroot
          retention-days: 30
          if-no-files-found: error

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.sbomviewer.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "site"
          api_location: ""
          output_location: ""
          skip_app_build: true

  smoke-staging:
    needs: [build, deploy-staging]
    uses: ./.github/workflows/smoke.yml
    with:
      base_url: https://staging.sbomviewer.com
      version: ${{ needs.build.outputs.version }}
      label: staging

  # The production environment has a required reviewer: the run pauses here
  # until approved. Rejecting it ends the run with no tag and no release.
  deploy-production:
    needs: [build, smoke-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sbomviewer.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "site"
          api_location: ""
          output_location: ""
          skip_app_build: true

  smoke-production:
    needs: [build, deploy-production]
    uses: ./.github/workflows/smoke.yml
    with:
      base_url: https://sbomviewer.com
      version: ${{ needs.build.outputs.version }}
      label: production

  release:
    needs: [build, smoke-production]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      # The zip is what a rollback redeploys: the exact files that ran in production.
      - name: Package the deployed site
        run: cd site && zip -qr "../sbomviewer-${VERSION}.zip" .

      - name: Tag and create GitHub release
        run: |
          TAG="v${VERSION}"
          PREV=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          ARGS=(--target "$GITHUB_SHA" --title "$TAG" --latest
                --notes "Deployed to [sbomviewer.com](https://sbomviewer.com) from commit ${GITHUB_SHA}."
                --generate-notes)
          [ -n "$PREV" ] && ARGS+=(--notes-start-tag "$PREV")
          gh release create "$TAG" "sbomviewer-${VERSION}.zip" "${ARGS[@]}"

  # ---- Status back to the PR, and the automatic rollback request ----
  # Notifications are best-effort: a failed comment never fails the release.

  notify-staging:
    needs: [build, smoke-staging]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          PR=$(gh api "repos/${GH_REPO}/commits/${GITHUB_SHA}/pulls" --jq '.[0].number // empty')
          [ -z "$PR" ] && { echo "No PR for ${GITHUB_SHA}"; exit 0; }
          gh pr comment "$PR" --body "**v${{ needs.build.outputs.version }}** is on [staging.sbomviewer.com](https://staging.sbomviewer.com) and passed its smoke test.

          [Review the production deployment](${{ github.server_url }}/${GH_REPO}/actions/runs/${{ github.run_id }}) to ship it."

  notify-release:
    needs: [build, release]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          PR=$(gh api "repos/${GH_REPO}/commits/${GITHUB_SHA}/pulls" --jq '.[0].number // empty')
          [ -z "$PR" ] && { echo "No PR for ${GITHUB_SHA}"; exit 0; }
          V="${{ needs.build.outputs.version }}"
          gh pr comment "$PR" --body "Released **[v${V}](${{ github.server_url }}/${GH_REPO}/releases/tag/v${V})** to [sbomviewer.com](https://sbomviewer.com)."

  # Production is serving a build that failed its smoke test, and it has no tag.
  # Request a rollback to the latest release (it still waits for your approval),
  # with this commit as the one to revert on main.
  production-failed:
    needs: [build, smoke-production]
    if: always() && needs.smoke-production.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      actions: write   # dispatch rollback.yml
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          V="${{ needs.build.outputs.version }}"
          LIVE=$(gh release view --json tagName --jq .tagName | sed 's/^v//')
          gh workflow run rollback.yml --ref main -f version="$LIVE" -f bad_commit="$GITHUB_SHA"
          gh issue create --title "v${V} failed its production smoke test: rollback requested" --body "The release run [${{ github.run_id }}](${{ github.server_url }}/${GH_REPO}/actions/runs/${{ github.run_id }}) deployed **v${V}** (commit ${GITHUB_SHA}) and its production smoke test failed. No tag was created.

          A rollback to **v${LIVE}** has been requested. **Approve it** in [Actions → Rollback](${{ github.server_url }}/${GH_REPO}/actions/workflows/rollback.yml) to restore production. It then pushes a branch reverting ${GITHUB_SHA::7} and opens a revert issue.

          If the smoke failure was a flake (check the smoke artifact), reject the rollback and re-run the smoke job instead."
