<body>
  <div id="app">
    <svg class="loading-progress">
      <circle r="40%" cx="50%" cy="50%" />
      <circle r="40%" cx="50%" cy="50%" />
    </svg>
    <div class="loading-progress-text"></div>
  </div>

  <div id="blazor-error-ui">
    An unhandled error has occurred.
    <a href="." class="reload">Reload</a>
    <span class="dismiss">🗙</span>
  </div>

  <!-- Theme + font-scale: apply before paint to avoid flash -->
  <script>
    (function () {
      var t = localStorage.getItem('sbom-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
      var scale = parseFloat(localStorage.getItem('sbom-font-scale') || '1');
      document.documentElement.style.setProperty('--font-scale', scale);
    })();

    /* Flat global functions — called from Blazor JS interop (no dotted paths) */
    window.sbomGetTheme = function () {
      return localStorage.getItem('sbom-theme') || 'light';
    };
    window.sbomSetTheme = function (t) {
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('sbom-theme', t);
    };
    window.sbomGetFontScale = function () {
      return parseFloat(localStorage.getItem('sbom-font-scale') || '1');
    };
    window.sbomSetFontScale = function (s) {
      document.documentElement.style.setProperty('--font-scale', String(s));
      localStorage.setItem('sbom-font-scale', String(s));
    };
    window.sbomDownloadFile = function (filename, content) {
      var blob = new Blob([content], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    };
  </script>

  <script src="_framework/blazor.webassembly.js"></script>
</body>
